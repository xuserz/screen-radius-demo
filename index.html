<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Демо радиуса модалки</title>
  <style>
    :root {
      color-scheme: dark;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-max: max(var(--safe-top), var(--safe-right), var(--safe-bottom), var(--safe-left));
      --screen-radius: clamp(0px, calc(var(--safe-max) * 1.45 + 1.5vw), 60px);
      --modal-gap: 8px;
      --modal-radius: max(20px, calc(var(--screen-radius) - var(--modal-gap)));
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: #08090c;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }

    body { min-height: 100svh; overflow: hidden; }

    .screen {
      min-height: 100svh;
      padding: max(24px, var(--safe-top)) 20px 260px;
      background:
        radial-gradient(circle at 18% 5%, rgba(114, 92, 255, .42), transparent 34%),
        radial-gradient(circle at 95% 85%, rgba(255, 68, 143, .22), transparent 32%),
        linear-gradient(145deg, #171a25, #090a0e 65%);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: rgba(255,255,255,.55);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 430px;
      margin: 0;
      font-size: clamp(30px, 8vw, 52px);
      line-height: .98;
      letter-spacing: -.045em;
    }

    .description {
      max-width: 430px;
      margin-top: 18px;
      color: rgba(255,255,255,.66);
      font-size: 16px;
      line-height: 1.5;
    }

    button {
      border: 0;
      color: #fff;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    .open-button {
      margin-top: 24px;
      padding: 13px 18px;
      border-radius: 16px;
      background: #fff;
      color: #111319;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.27);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      transition: opacity 180ms ease;
    }

    .modal {
      position: fixed;
      right: 8px;
      bottom: calc(8px - env(safe-area-inset-bottom, 0px));
      left: 8px;
      overflow: hidden;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: var(--modal-radius);
      background: rgba(35,37,47,.9);
      box-shadow: 0 24px 80px rgba(0,0,0,.55), inset 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(28px) saturate(1.3);
      -webkit-backdrop-filter: blur(28px) saturate(1.3);
      transform-origin: bottom center;
      transition: transform 220ms cubic-bezier(.2,.8,.2,1), opacity 180ms ease;
    }

    .modal__inner {
      padding: 18px;
      border-radius: max(14px, calc(var(--modal-radius) - 8px));
      background: rgba(255,255,255,.055);
    }

    .handle {
      width: 42px;
      height: 5px;
      margin: 0 auto 17px;
      border-radius: 999px;
      background: rgba(255,255,255,.24);
    }

    .modal h2 { margin: 0; font-size: 22px; }
    .modal p { margin: 8px 0 18px; color: rgba(255,255,255,.62); line-height: 1.45; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .metric {
      padding: 12px;
      border-radius: 15px;
      background: rgba(0,0,0,.19);
    }

    .metric span { display: block; margin-bottom: 4px; color: rgba(255,255,255,.45); font-size: 12px; }
    .metric strong { font-size: 16px; }

    .close-button {
      width: 100%;
      padding: 14px;
      border-radius: 15px;
      background: #7c6cff;
    }

    .measure {
      position: fixed;
      top: -1000px;
      left: -1000px;
      height: 1px;
      visibility: hidden;
    }

    .hidden { pointer-events: none; opacity: 0; }
    .modal.hidden { transform: translateY(24px) scale(.98); }

    @media (min-width: 700px) {
      :root { --screen-radius: 32px; }
      .modal {
        right: 50%;
        left: auto;
        width: min(440px, calc(100vw - 16px));
        transform: translateX(50%);
      }
      .modal.hidden { transform: translateX(50%) translateY(24px) scale(.98); }
    }
  </style>
</head>
<body>
  <main class="screen">
    <p class="eyebrow">Border radius demo</p>
    <h1>Модалка повторяет скругление экрана</h1>
    <p class="description">Модалка визуально опущена до 8px от физического нижнего края экрана.</p>
    <button class="open-button" id="openButton">Открыть модалку</button>

    <div class="backdrop" id="backdrop"></div>

    <div class="measure" id="measureSafeBottom" style="width:var(--safe-bottom)"></div>
    <div class="measure" id="measureScreenRadius" style="width:var(--screen-radius)"></div>
    <div class="measure" id="measureModalRadius" style="width:var(--modal-radius)"></div>

    <section class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal__inner">
        <div class="handle"></div>
        <h2>Отступ ровно 8px</h2>
        <p>Safari поднимает нижнюю границу viewport, поэтому safe area вычитается из bottom.</p>

        <div class="metrics">
          <div class="metric"><span>Safe bottom</span><strong id="safeBottom">—</strong></div>
          <div class="metric"><span>Отступ модалки</span><strong>8px</strong></div>
          <div class="metric"><span>Радиус экрана</span><strong id="screenRadius">—</strong></div>
          <div class="metric"><span>Радиус модалки</span><strong id="modalRadius">—</strong></div>
        </div>

        <button class="close-button" id="closeButton">Закрыть</button>
      </div>
    </section>
  </main>

  <script>
    const modal = document.querySelector('#modal');
    const backdrop = document.querySelector('#backdrop');

    const width = id => `${document.querySelector(id).getBoundingClientRect().width.toFixed(1)}px`;

    function updateMetrics() {
      document.querySelector('#safeBottom').textContent = width('#measureSafeBottom');
      document.querySelector('#screenRadius').textContent = width('#measureScreenRadius');
      document.querySelector('#modalRadius').textContent = width('#measureModalRadius');
    }

    function setOpen(open) {
      modal.classList.toggle('hidden', !open);
      backdrop.classList.toggle('hidden', !open);
    }

    document.querySelector('#openButton').addEventListener('click', () => setOpen(true));
    document.querySelector('#closeButton').addEventListener('click', () => setOpen(false));
    backdrop.addEventListener('click', () => setOpen(false));
    window.addEventListener('resize', updateMetrics);
    window.addEventListener('orientationchange', () => setTimeout(updateMetrics, 150));
    requestAnimationFrame(updateMetrics);
  </script>
</body>
</html>
